name: Monthly Digest Dispatch

on:
  schedule:
    # Trigger at 09:00 UTC on the 1st of every month
    - cron: '0 9 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (generate digest without sending email)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  dispatch-digest:
    name: Generate & Send Monthly Digest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Live Curator Pipeline
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          ELLIOTT_SPOTIFY_REFRESH_TOKEN: ${{ secrets.ELLIOTT_SPOTIFY_REFRESH_TOKEN }}
          CHLOE_SPOTIFY_REFRESH_TOKEN: ${{ secrets.CHLOE_SPOTIFY_REFRESH_TOKEN }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}" = "true" ]; then
            echo "Running in dry-run mode (no email sent)..."
            python3 main.py --preview-html
          else
            echo "Running automated monthly dispatch with email delivery..."
            python3 main.py --send-email --preview-html
          fi

      - name: Upload digest preview and cache artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-digest-output
          path: |
            output/
            data/cache/
          retention-days: 30
